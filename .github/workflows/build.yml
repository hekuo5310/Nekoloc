name: Build Apps

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: stable

jobs:
  checks:
    name: Flutter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test test/models_test.dart test/topic_links_test.dart

  # ============================================================ Android
  android:
    name: Android (APK / AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform project
        run: |
          flutter create . --platforms=android --org com.nodeloc --project-name nodeloc_app

      - name: Patch platform files & icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 scripts/patch_platforms.py

      - name: Pub get
        run: flutter pub get

      - name: Build APK (fat / universal)
        run: flutter build apk --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Nekoloc-Android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Nekoloc-Android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Nekoloc-Android-armv7.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Nekoloc-Android-x64.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/Nekoloc-Android-playstore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: nodeloc-android
          path: dist/*
          if-no-files-found: error

  # ============================================================ Linux
  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK / WebKit / Ninja deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev
          # desktop_webview_window 需要 webkit2gtk（优先 4.1，回退 4.0）
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev || sudo apt-get install -y -qq libwebkit2gtk-4.0-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform project
        run: flutter create . --platforms=linux --org com.nodeloc --project-name nodeloc_app

      - name: Patch platform files
        run: python3 scripts/patch_platforms.py

      - name: Pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Pack artifact
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/nodeloc-linux.tar.gz" bundle

      - uses: actions/upload-artifact@v4
        with:
          name: nodeloc-linux
          path: nodeloc-linux.tar.gz
          if-no-files-found: error

  # ============================================================ Windows
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform project
        run: flutter create . --platforms=windows --org com.nodeloc --project-name nodeloc_app

      - name: Patch platform files
        run: python scripts/patch_platforms.py

      - name: Pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Pack artifact
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nodeloc-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nodeloc-windows
          path: nodeloc-windows.zip
          if-no-files-found: error

  # ============================================================ macOS + iOS
  apple:
    name: macOS + iOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform project
        run: flutter create . --platforms=ios,macos --org com.nodeloc --project-name nodeloc_app

      - name: Patch platform files & icons
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || true
          python3 scripts/patch_platforms.py

      - name: Pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Pack macOS app
        run: |
          cd build/macos/Build/Products/Release
          APP=$(find . -maxdepth 1 -name '*.app' -print -quit)
          echo "Packing: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/nodeloc-macos.zip"
          ls -lh "$GITHUB_WORKSPACE/nodeloc-macos.zip"

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Pack unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry nodeloc-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: nodeloc-macos
          path: nodeloc-macos.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nodeloc-ios
          path: nodeloc-ios-unsigned.ipa
          if-no-files-found: error

  # ============================================================ Release（打 tag 时发布）
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
