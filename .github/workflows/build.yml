name: Build Apps

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: stable

jobs:
  checks:
    name: Flutter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: flutter pub get
      - run: flutter test
      - run: flutter test test/update_source_test.dart --dart-define=PLAY_DISTRIBUTION=true

  # ============================================================ Android
  android:
    name: Android (APK / AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform project
        run: |
          flutter create . --platforms=android --org com.nodeloc --project-name nodeloc_app

      - name: Patch platform files & icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 scripts/patch_platforms.py

      - name: Pub get
        run: flutter pub get

      - name: Build APK (fat / universal)
        run: flutter build apk --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Verify Android package name
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          sdk = Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
          tools = sorted(sdk.glob('build-tools/*/aapt'))
          if not tools:
              raise SystemExit('Android aapt not found')
          apks = sorted(Path('build/app/outputs/flutter-apk').glob('app*.apk'))
          if len(apks) != 4:
              raise SystemExit(f'Expected four release APKs, got {len(apks)}')
          for apk in apks:
              output = subprocess.check_output([str(tools[-1]), 'dump', 'badging', str(apk)], text=True)
              package = re.search(r"^package: name='([^']+)'", output, re.MULTILINE)
              if package is None or package.group(1) != 'net.zerexa.nekoloc':
                  raise SystemExit(f'Wrong package in {apk}')
              print(f'{apk.name}: {package.group(1)}')
          PY

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Nekoloc-Android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Nekoloc-Android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Nekoloc-Android-armv7.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Nekoloc-Android-x64.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/Nekoloc-Android-playstore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: nodeloc-android
          path: dist/*
          if-no-files-found: error

      - name: Verify upload signing with a disposable CI key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nekoloc-signing-smoke.jks
          ANDROID_KEYSTORE_PASSWORD: ci-test-only-password
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ci-test-only-password
        run: |
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -storetype JKS -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Nekoloc CI test" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD
          python3 scripts/android_signing.py
          flutter build appbundle --release
          python3 scripts/android_signing.py --verify build/app/outputs/bundle/release/app-release.aab

  # ============================================================ Linux
  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK / WebKit / Ninja deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev
          # desktop_webview_window 需要 webkit2gtk（优先 4.1，回退 4.0）
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev || sudo apt-get install -y -qq libwebkit2gtk-4.0-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform project
        run: flutter create . --platforms=linux --org com.nodeloc --project-name nodeloc_app

      - name: Patch platform files
        run: python3 scripts/patch_platforms.py

      - name: Pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Pack artifact
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/nodeloc-linux.tar.gz" bundle

      - uses: actions/upload-artifact@v4
        with:
          name: nodeloc-linux
          path: nodeloc-linux.tar.gz
          if-no-files-found: error

  # ============================================================ Windows
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform project
        run: flutter create . --platforms=windows --org com.nodeloc --project-name nodeloc_app

      - name: Patch platform files
        run: python scripts/patch_platforms.py

      - name: Pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Pack artifact
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nodeloc-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nodeloc-windows
          path: nodeloc-windows.zip
          if-no-files-found: error

  # ============================================================ macOS + iOS
  apple:
    name: macOS + iOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform project
        run: flutter create . --platforms=ios,macos --org com.nodeloc --project-name nodeloc_app

      - name: Patch platform files & icons
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || true
          python3 scripts/patch_platforms.py

      - name: Pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Pack macOS app
        run: |
          cd build/macos/Build/Products/Release
          APP=$(find . -maxdepth 1 -name '*.app' -print -quit)
          echo "Packing: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/nodeloc-macos.zip"
          ls -lh "$GITHUB_WORKSPACE/nodeloc-macos.zip"

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Pack unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry nodeloc-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: nodeloc-macos
          path: nodeloc-macos.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nodeloc-ios
          path: nodeloc-ios-unsigned.ipa
          if-no-files-found: error

  # ============================================================ Release（打 tag 时发布）
  release:
    name: GitHub Release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: [checks, android, linux, windows, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^version: \([0-9][0-9.]*\)+[0-9][0-9]*$/\1/p' pubspec.yaml)"
          fi
          if [[ "$tag" == "v" ]]; then exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          changelog = Path('CHANGELOG.md').read_text()
          heading = f'## [{tag}]'
          section = next((part for part in changelog.split('\n---\n')
                          if part.strip().startswith(heading)), None)
          if section is None:
              raise SystemExit(f'Missing changelog entry for {tag}')
          Path('release_notes.md').write_text(section.strip() + '\n')
          PY

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          files: dist/*

  # Tags created with GITHUB_TOKEN do not trigger another push workflow.
  # Call Play explicitly after an automatic [release] tag is published.
  play-release:
    name: Publish tagged version to Google Play
    needs: release
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/play.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
