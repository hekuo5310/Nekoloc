name: Google Play

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: true
  workflow_dispatch:
    inputs:
      mode:
        description: 'build-only 只构建；auto 按 main / v* 标签自动选择公开测试 / 正式版'
        type: choice
        options: [build-only, auto]
        default: build-only

permissions:
  contents: read

concurrency:
  group: google-play
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name != 'push' || github.ref != 'refs/heads/main' ||
       !contains(github.event.head_commit.message, '[release]') || inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Play version and track
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/play_metadata.py
      - name: Validate required secrets
        env:
          MODE: ${{ inputs.mode }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [name for name in names if not os.environ[name]]
          if missing:
              raise SystemExit('Missing GitHub Secrets: ' + ', '.join(missing))
          if os.environ['MODE'] != 'build-only':
              try:
                  account = json.loads(os.environ['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'])
                  assert account['type'] == 'service_account'
                  assert all(account.get(k) for k in ['client_email', 'private_key', 'token_uri'])
              except (ValueError, KeyError, AssertionError, TypeError):
                  raise SystemExit('GOOGLE_PLAY_SERVICE_ACCOUNT_JSON must contain a service account key JSON')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          flutter pub get
          flutter test
      - name: Generate and patch Android project
        run: |
          flutter create . --platforms=android --org com.nodeloc --project-name nodeloc_app
          python3 -m pip install pillow
          python3 scripts/patch_platforms.py
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'nekoloc-upload.jks'
          data = base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True)
          with path.open('wb') as f:
              os.chmod(path, 0o600)
              f.write(data)
          PY
      - name: Build and verify signed AAB
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nekoloc-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 scripts/android_signing.py
          flutter build appbundle --release --build-number="$VERSION_CODE" --build-name="$VERSION_NAME"
          python3 scripts/android_signing.py --verify build/app/outputs/bundle/release/app-release.aab
      - name: Save signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nekoloc-Play-${{ steps.version.outputs.release_name }}-${{ steps.version.outputs.version_code }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish Google Play release
        if: inputs.mode != 'build-only'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.zerexa.nekoloc
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ steps.version.outputs.track }}
          releaseName: ${{ steps.version.outputs.release_name }}
          status: completed
      - name: Clean up upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nekoloc-upload.jks"
